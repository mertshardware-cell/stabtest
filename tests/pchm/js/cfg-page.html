<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>PCHM Konfigurator-Test</title>
    <link rel="stylesheet" href="/pchm_crit.css">
    <link rel="stylesheet" href="/pchm.css">
    <script>
        // Wie Bootstrap::jsConfig (pchm_js_config), Modus/Sperre per ?mode=disable&block=0 umschaltbar
        var q = new URLSearchParams(location.search);
        window.pchmConfig = {
            konfigurator: { groupNav: true, compat: true, compatMode: q.get('mode') || 'mark', blockCart: q.get('block') !== '0', psuHint: true },
            texts: {
                cfgProgress: '{0} von {1} Gruppen gewählt', cfgRequired: 'Pflicht', cfgNotChosen: 'nicht gewählt',
                cfgCompatTitle: 'Kompatibilität', cfgCompatOk: 'Alles passt zusammen', cfgCompatBlocked: '{0} Konflikt(e)',
                cfgCompatUnknown: '{0} Angabe(n) fehlen', cfgPsuNeed: 'Empfohlenes Netzteil: mind. {0} W',
                cfgCartBlocked: 'Bitte zuerst die Konflikte lösen.', cfgItemBlocked: 'Passt nicht', cfgItemUnknown: 'Ungeprüft',
                cfgSocketOk: 'Sockel passt ({0})', cfgSocketBad: 'Sockel passt nicht: CPU {0}, Mainboard {1}', cfgSocketUnknown: 'Sockel unbekannt',
                cfgGpuOk: 'Grafikkarte passt ins Gehäuse ({0} / {1} mm)', cfgGpuBad: 'Grafikkarte zu lang: {0} mm, Gehäuse max. {1} mm', cfgGpuUnknown: 'GPU-Länge unbekannt',
                cfgRamOk: 'RAM passt ({0})', cfgRamBad: 'RAM passt nicht: {0} statt {1}', cfgRamUnknown: 'RAM-Typ unbekannt',
                cfgCoolerOk: 'Kühler passt ({0} / {1} mm)', cfgCoolerBad: 'Kühler zu hoch: {0} mm, Gehäuse max. {1} mm', cfgCoolerUnknown: 'Kühlerhöhe unbekannt',
                cfgPsuOk: 'Netzteil reicht ({0} / {1} W)', cfgPsuBad: 'Netzteil zu schwach: {0} W, nötig {1} W', cfgPsuUnknown: 'Netzteilleistung unbekannt'
            }
        };
    </script>
</head>
<body class="pchm">
<form id="buy_form" method="post" action="/cart">
    <div id="cfg-container" class="row">
        <div class="col-lg-8">
            <div class="tab-content cfg-list" id="cfg-container-tab-panes">
                <!-- Ausgabe von snippets/pchm/cfg_top.tpl -->
                <script type="application/json" id="pchm-cfg-data">{"groups":[
                    {"id":1,"name":"Prozessor","type":"CPU","min":1,"max":1,"items":{
                        "11":{"name":"AMD Ryzen 7 7800X3D","type":"CPU","spec":{"socket":"AM5","tdp_watts":120}},
                        "12":{"name":"Intel Core i7-14700K","type":"CPU","spec":{"socket":"LGA1700","tdp_watts":253}}}},
                    {"id":2,"name":"Mainboard","type":"Mainboard","min":1,"max":1,"items":{
                        "21":{"name":"ASUS B650","type":"Mainboard","spec":{"socket":"AM5","ram_type":"DDR5"}},
                        "22":{"name":"MSI Z790","type":"Mainboard","spec":{"socket":"LGA1700","ram_type":"DDR5"}}}},
                    {"id":3,"name":"Arbeitsspeicher","type":"RAM","min":1,"max":1,"items":{
                        "31":{"name":"32 GB DDR5","type":"RAM","spec":{"ram_type":"DDR5"}},
                        "32":{"name":"32 GB DDR4","type":"RAM","spec":{"ram_type":"DDR4"}}}},
                    {"id":4,"name":"Grafikkarte","type":"GPU","min":0,"max":1,"items":{
                        "41":{"name":"RTX 4070","type":"GPU","spec":{"length_mm":300,"tdp_watts":200}},
                        "42":{"name":"RTX 4090","type":"GPU","spec":{"length_mm":360,"tdp_watts":450}}}},
                    {"id":5,"name":"Gehäuse","type":"Gehäuse","min":1,"max":1,"items":{
                        "51":{"name":"Compact Case","type":"Gehäuse","spec":{"max_gpu_length_mm":320,"max_cooler_height_mm":160}},
                        "52":{"name":"Big Tower","type":"Gehäuse","spec":{"max_gpu_length_mm":420,"max_cooler_height_mm":180}}}},
                    {"id":6,"name":"Netzteil","type":"Netzteil","min":1,"max":1,"items":{
                        "61":{"name":"550 W","type":"Netzteil","spec":{"psu_watts":550}},
                        "62":{"name":"1000 W","type":"Netzteil","spec":{"psu_watts":1000}}}}
                ]}</script>
                <nav id="pchm-cfg-nav" class="pchm-cfg-nav" hidden></nav>
                <!-- NOVA config_options_list.tpl (vereinfacht) -->
                <div id="cfg-grp-1" class="cfg-group js-cfg-group" data-id="1">
                    <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" name="item[1][]" value="11" id="item11"><label class="custom-control-label" for="item11"><div data-id="11" class="config-item">AMD Ryzen 7 7800X3D</div></label></div>
                    <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" name="item[1][]" value="12" id="item12"><label class="custom-control-label" for="item12"><div data-id="12" class="config-item">Intel Core i7-14700K</div></label></div>
                </div>
                <div id="cfg-grp-2" class="cfg-group js-cfg-group" data-id="2">
                    <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" name="item[2][]" value="21" id="item21"><label class="custom-control-label" for="item21"><div data-id="21" class="config-item">ASUS B650</div></label></div>
                    <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" name="item[2][]" value="22" id="item22"><label class="custom-control-label" for="item22"><div data-id="22" class="config-item">MSI Z790</div></label></div>
                </div>
                <div id="cfg-grp-3" class="cfg-group js-cfg-group" data-id="3">
                    <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" name="item[3][]" value="31" id="item31"><label class="custom-control-label" for="item31"><div data-id="31" class="config-item">32 GB DDR5</div></label></div>
                    <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" name="item[3][]" value="32" id="item32"><label class="custom-control-label" for="item32"><div data-id="32" class="config-item">32 GB DDR4</div></label></div>
                </div>
                <div id="cfg-grp-4" class="cfg-group js-cfg-group" data-id="4">
                    <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" name="item[4][]" value="41" id="item41"><label class="custom-control-label" for="item41"><div data-id="41" class="config-item">RTX 4070</div></label></div>
                    <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" name="item[4][]" value="42" id="item42"><label class="custom-control-label" for="item42"><div data-id="42" class="config-item">RTX 4090</div></label></div>
                </div>
                <div id="cfg-grp-5" class="cfg-group js-cfg-group" data-id="5">
                    <select class="custom-select" name="item[5][]" id="cfg-select-5">
                        <option value="">Bitte wählen</option>
                        <option value="51" id="item51">Compact Case</option>
                        <option value="52" id="item52">Big Tower</option>
                    </select>
                </div>
                <div id="cfg-grp-6" class="cfg-group js-cfg-group" data-id="6" style="margin-bottom:1200px">
                    <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" name="item[6][]" value="61" id="item61"><label class="custom-control-label" for="item61"><div data-id="61" class="config-item">550 W</div></label></div>
                    <div class="custom-control custom-radio"><input class="custom-control-input" type="radio" name="item[6][]" value="62" id="item62"><label class="custom-control-label" for="item62"><div data-id="62" class="config-item">1000 W</div></label></div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div id="product-configuration-sidebar"><table id="configuration-table" class="table table-striped"><tbody class="summary"></tbody></table></div>
        </div>
    </div>
    <input type="hidden" name="item_quantity" value="1">
    <button type="submit" name="inWarenkorb" value="1" class="btn btn-primary">In den Warenkorb</button>
</form>
<script src="/jquery-3.7.1.min.js"></script>
<script>
    // Ersatz für $.evo.extended().showNotify aus NOVA
    window.notified = [];
    $.evo = { extended: function () { return { showNotify: function (o) { window.notified.push(o); } }; } };
</script>
<script defer src="/pchm-konfigurator.js"></script>
</body>
</html>
