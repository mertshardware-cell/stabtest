<!DOCTYPE html>

<script src="jquery-3.7.1.min.js"></script>
<script>
    window.pchmConfig = Object.assign({"groupNet":false,"priceSwitch":true,"sideBasket":true,"sideBasketOpen":true,"sideAccount":true,"sticky":"all","searchPlaceholder":"Wonach suchst du?","megaMenuMode":"hover","tabJumpNav":true,"stickyBuyBar":true,"buttonTotal":true,"descriptionFold":true,"sidebarToggle":true,"currency":{"decimal":",","thousands":".","symbol":"€","before":false},"texts":{"priceAltGross":"inkl. %s %% MwSt.","priceAltNet":"zzgl. %s %% MwSt.","days":"Tage","hours":"Std.","minutes":"Min.","seconds":"Sek.","readMore":"Weiterlesen","readLess":"Weniger anzeigen","jumpTo":"Springe zu","close":"Schließen","filterToggle":"Filter ein-/ausblenden"}}, JSON.parse(new URLSearchParams(location.search).get('cfg') || '{}'));
    (function (d, cfg) {
        var mode = cfg.groupNet ? 'net' : 'gross';
        try { var stored = cfg.priceSwitch ? window.localStorage.getItem('pchmPriceMode') : null; if (stored === 'net' || stored === 'gross') { mode = stored; } } catch (e) {}
        d.documentElement.classList.add('pchm-price-mode-' + mode);
        if ((mode === 'net') !== !!cfg.groupNet) { d.documentElement.classList.add('pchm-price-alt-active'); }
    })(document, window.pchmConfig);
</script>
<script defer src="bootstrap.bundle.min.js"></script>
<script defer src="jquery.serialize-object.min.js"></script>
<script>
    // Minimaler Ersatz für NOVAs $.evo (IO + Notify)
    window.ioCalls = [];
    window.cartCount = 2;
    function cartTemplate(n) {
        return '<li class="cart-icon-dropdown nav-item pchm-cart-trigger not-empty">'
            + '<a class="nav-link" href="/warenkorb" data-pchm-offcanvas="cart" aria-expanded="false"><i class="fas fa-shopping-cart"><span class="fa-sup">' + n + '</span></i></a>'
            + '<template class="pchm-cart-template"><div class="pchm-free-shipping"></div><div id="cart-dropdown-container" class="cart-dropdown dropdown-menu">' + n + ' Artikel im Warenkorb</div></template></li>';
    }
    $.evo = {
        io: function () { return { call: function (name, args, ctx, cb) {
            window.ioCalls.push(name);
            setTimeout(function () {
                if (name === 'pushToBasket') { window.cartCount += 1; cb(null, { response: { nType: 2, cPopup: 'ok', cNotification: 'ok' } }); }
                if (name === 'getBasketItems') { cb(null, { response: { cTemplate: cartTemplate(window.cartCount) } }); }
            }, 20);
        } }; },
        extended: function () { return { showNotify: function (o) { window.notified = o; } }; },
        trigger: function (e, a) { $(document).trigger('evo:' + e, a); }
    };
</script>
<script defer src="jtl.basket.js"></script>
<script defer src="custom.js"></script>
</head>

<script>
    // Countdown: Ende in 2 Tagen + 3 Std.
    var now = Math.floor(Date.now() / 1000);
    document.getElementById('cd').setAttribute('data-pchm-countdown', now + 2 * 86400 + 3 * 3600 + 30);
    document.getElementById('cd').setAttribute('data-pchm-now', now);
    // NOVA: Hover-Handler, die im Klick-Modus entfernt werden müssen
    $(document).on('mouseenter', '#mainNavigation .navbar-nav > .dropdown', function () { window.novaHover = (window.novaHover || 0) + 1; });
</script>
